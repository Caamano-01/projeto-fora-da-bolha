<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>

    <!-- Link style -->
    <link rel="stylesheet" href="style/style3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <main>
        <!-- COMUNIDADES -->
            <div class="container-1">
                <div class="header-icons">
                    <h1><a href="#comunidades"><span class="icon-circle"><i class="fas fa-star"></i></span>Comunidades</a></h1>
                    <div class="user-actions">
                        <a href="feed.html"><span class="icon-circle"><i class="fas fa-tshirt"></i></span></a>
                        <a href="feed.html"><span class="icon-circle"><i class="fas fa-user-friends"></i></span></a>
                        <a href="#agora-no-mundo"><span class="icon-circle"><i class="fas fa-globe"></i></span></a>
                        <span class="icon-circle" id="btnFazerPost" style="cursor:pointer;"><i class="fas fa-plus"></i></span>
                    </div>
                </div>

                <div id="modalOverlay">
                    <form id="postForm">
                        <button type="button" id="closeModalBtn" title="Fechar">×</button>
                        <input type="text" id="usuario" placeholder="@seu-usuario" required />

                        <select id="comunidadesPost" multiple size="5" required>
                            </select>
                        
                        <textarea id="legenda" placeholder="Legenda do post" required></textarea>
                        <input type="file" id="imagemUpload" accept="image/*" />
                        <input type="text" id="imagemURL" placeholder="Ou cole a URL da imagem" />
                        <button type="submit">Postar</button>
                    </form>
                </div>

                <div class="communities-feed">
                    <div class="communities-list" id="listaComunidades">
                        <!-- As bolhas serão renderizadas aqui dinamicamente -->
                    </div>

                    <div id="feedPosts">
                        <!-- Os posts serão renderizados aqui -->
                    </div>
                </div>
            </div>


        <!-- AGORA NO MUNDO -->
            
    </main>
    
    <!-- Script -->
    <script type="module" src="js/script3.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
